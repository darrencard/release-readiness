[project]
name = "release-readiness"
version = "0.3.1"
description = "A Claude skill that says whether one release is ready to ship or must hold, step 03 of the Landing Loop."
requires-python = ">=3.11"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 160
target-version = "py311"
# Copied byte for byte at pinned commits (VENDORED.json): the Leader Report template and landing-loop's svgkit. Linted there, never edited here.
extend-exclude = ["skills/release-readiness/assets/vendor", "skills/release-readiness/scripts/vendor"]

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: old syntax.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.isort]
# evals/helpers.py puts the scripts folder on sys.path, so it must be imported before the scripts.
known-local-folder = ["helpers"]
known-first-party = ["readiness", "from_gh", "validate", "loop", "landing_brief", "render_html", "svgkit"]
section-order = ["future", "standard-library", "third-party", "local-folder", "first-party"]

[tool.ruff.lint.per-file-ignores]
# Vendored unchanged from the landing-brief skill, which targets Python 3.9.
"skills/release-readiness/scripts/landing_brief.py" = ["UP", "E501", "S101"]
# The page's CSS and markup read best one rule or row per line.
"skills/release-readiness/scripts/render_html.py" = ["E501"]
# Tests run this repo's own scripts with fixed arguments.
"evals/**" = ["S603", "S101"]
